<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kordoc local</title>
<style>
  :root{--bg:#fafaf8;--fg:#1f1f1f;--muted:#777;--line:#ddd;--acc:#2f6fed}
  body{font:15px/1.65 -apple-system,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:1200px;margin:0 auto;padding:20px 16px}
  h1{font-size:20px;margin:0 0 4px}h1 small{font-weight:400;color:var(--muted);font-size:13px}
  .row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:300px}
  textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;box-sizing:border-box;background:#fff;resize:vertical}
  #q{height:90px}#out{height:360px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  select,button,input[type=file]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
  button.primary{background:var(--acc);color:#fff;border-color:var(--acc);padding:6px 22px;cursor:pointer}button:disabled{opacity:.5}
  #status,#stages{color:var(--muted);font-size:13px}#stages{min-height:1.4em;margin:6px 0}#stages b{color:var(--fg)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px}
  .tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
  .tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
  .pane{display:none;padding:12px 0}.pane.on{display:block}
  pre{white-space:pre-wrap;background:#f1f1ee;padding:12px;border-radius:6px;font-size:13px;line-height:1.5;overflow-x:auto}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
  .ok{background:#dff5e1;color:#1a6b2a}.warn{background:#fff2cc;color:#8a6100}.bad{background:#fde2e2;color:#a33}
  #meta{margin:10px 0;font-size:14px}#meta span{margin-right:14px}#meta a{color:var(--acc);font-weight:600}
  table.cg{width:100%;border-collapse:collapse;font-size:14px}table.cg td,table.cg th{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top;text-align:left}
  table.cg th{font-size:12px;color:var(--muted)}table.cg td.n{color:var(--muted);width:2em}del{background:#fde2e2;text-decoration:line-through;color:#a33}ins{background:#dff5e1;text-decoration:none;color:#1a6b2a}
  #runs{font-size:13px}#runs li{cursor:pointer;padding:3px 0;list-style:none}#runs li:hover{color:var(--acc)}
  details{margin-top:14px}summary{cursor:pointer;color:var(--muted);font-size:13px}
</style>

<h1>kordoc local <small>— HWP·HWPX·PDF·DOCX·XLSX → 로컬 Ollama 요약 · 질문 · 공문서 초안(HWPX) · 윤문(원본 서식 유지)</small></h1>
<div id="stages"></div>
<div class="bar">
  <input type="file" id="file" accept=".hwp,.hwpx,.hml,.pdf,.docx,.xlsx,.xls,.png,.jpg,.jpeg,.webp,.md,.txt">
  <label>작업 <select id="task"><option value="summary">요약<option value="qa">질문</option><option value="draft">공문서 초안 → HWPX</option></select></label>
  <label id="presetL" hidden>프리셋 <select id="preset"><option>보고서<option>기안문<option>간이기안문<option>계획서<option>통지<option>회의록<option>개조식<option>업무보고<option>서울방침<option>보도자료</select></label>
  <label>모델 <select id="model"></select></label>
</div>
<textarea id="q" placeholder="질문 또는 요청 (요약은 비워도 됨). 예: 3장 예산 총액은? / ○○ 개선방안 보고서 초안 써줘"></textarea>
<div class="bar">
  <button id="go" class="primary">실행</button>
  <button id="copy">결과 복사</button>
  <span id="status"></span>
</div>
<textarea id="out" placeholder="결과 (토큰 스트리밍)" readonly></textarea>

<div id="res" hidden>
  <div id="meta"></div>
  <div id="polishBar" class="bar" hidden style="background:#f1f5ff;border:1px solid #d6e2ff;border-radius:8px;padding:10px 12px">
    <b>✍ 윤문하기</b> <span id="polishWhat" style="color:var(--muted);font-size:13px"></span>
    <label>강도 <select id="strength"><option value="light">가볍게 (맞춤법·비문만)</option><option value="standard" selected>보통</option><option value="strong">적극 (간결하게)</option></select></label>
    <button id="polishGo" class="primary">윤문하기</button>
  </div>
  <div class="tabs">
    <button data-t="chg" id="chgT" hidden>변경 내역</button>
    <button data-t="src" class="on">파싱된 원문(Markdown)</button>
    <button data-t="lint">표기법 검수</button>
    <button data-t="log">로그</button>
  </div>
  <div id="p-chg" class="pane"><div id="chg"></div></div>
  <div id="p-src" class="pane on"><pre id="src"></pre></div>
  <div id="p-lint" class="pane"><pre id="lint"></pre></div>
  <div id="p-log" class="pane"><pre id="log"></pre></div>
</div>

<details><summary>이전 실행 기록</summary><ul id="runs"></ul></details>

<script>
const $ = id => document.getElementById(id);
const MODEL_DEFAULT = %MODEL%;
fetch('/api/models').then(r => r.json()).then(ms => {
  $('model').innerHTML = ms.map(m => `<option ${m === MODEL_DEFAULT ? 'selected' : ''}>${m}</option>`).join('');
}).catch(() => $('status').textContent = 'Ollama에 연결할 수 없습니다 (localhost:11434)');
$('task').onchange = () => $('presetL').hidden = $('task').value !== 'draft';
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button, .pane').forEach(e => e.classList.remove('on'));
  b.classList.add('on'); $('p-' + b.dataset.t).classList.add('on');
});
$('copy').onclick = () => navigator.clipboard.writeText($('out').value);

function show(j) {
  $('out').value = j.output; $('res').hidden = false;
  let m = `<span>run <code>${j.run_id}</code></span><span>작업 <b>${j.task}</b></span><span>모델 ${j.model}</span>`;
  if (j.file) m += `<span>문서 ${j.file}${j.truncated ? ' <span class="badge warn">앞부분만 사용</span>' : ''}</span>`;
  if (j.task === 'draft') {
    const l = j.lint && j.lint.summary;
    m += l ? `<span class="badge ${l.errors ? 'warn' : 'ok'}">표기법 ${l.errors ? l.errors + '건 수정 필요' : '통과'}</span>` : '';
    m += j.hwpx ? `<span class="badge ${j.valid ? 'ok' : 'bad'}">HWPX ${j.valid ? '검증 통과' : '검증 실패'}</span> <a href="/api/runs/${j.run_id}/03_result.hwpx">⬇ ${j.preset}.hwpx 내려받기</a>`
                : '<span class="badge bad">HWPX 생성 실패 (로그 확인)</span>';
  }
  if (j.task === 'polish') {
    const n = j.changes.length, l = j.lint && j.lint.summary;
    m += `<span class="badge ok">${j.units}조각 중 ${n}곳 윤문 · ${j.applied ?? n}곳 반영</span>`;
    if (j.rejected.length) m += `<span class="badge warn">${j.rejected.length}곳 원문 유지 (숫자·고유 표기 보호)</span>`;
    if (l) m += `<span class="badge ${l.errors ? 'warn' : 'ok'}">표기법 ${l.errors ? l.errors + '건 확인 필요' : '통과'}</span>`;
    m += j.hwpx ? `<span class="badge ${j.valid ? 'ok' : 'warn'}">${j.mode === 'patch' ? '원본 서식 유지' : j.preset + ' 프리셋으로 새로 생성'} · ${j.valid ? '검증 통과' : '일부 미반영'}</span> <a href="/api/runs/${j.run_id}/${j.hwpx}">⬇ 윤문본 ${j.hwpx.split('.').pop().toUpperCase()} 내려받기</a>`
                : '<span class="badge bad">문서 생성 실패 (로그 확인)</span>';
    const tr = (c, extra) => `<tr><td class="n">${c.n + 1}</td><td>${diff(c.before, c.after, 0)}</td><td>${diff(c.before, c.after, 1)}</td><td>${extra}</td></tr>`;
    $('chg').innerHTML = `<table class="cg"><tr><th></th><th>원문</th><th>윤문</th><th></th></tr>${j.changes.map(c => tr(c, c.applied === false ? '<span class="badge warn">미반영</span>' : '')).join('') || '<tr><td colspan=4>고친 곳 없음</td></tr>'}</table>`
      + (j.rejected.length ? `<h3 style="font-size:15px;margin:18px 0 6px">원문 유지 — 숫자·날짜·고유 표기가 바뀌어 받지 않은 제안</h3><table class="cg">${j.rejected.map(c => tr(c, `<span class="badge warn">${esc(c.reason)}</span>`)).join('')}</table>` : '');
    $('chgT').hidden = false; $('chgT').click();
  } else { $('chgT').hidden = true; document.querySelector('.tabs button[data-t=src]').click(); }
  $('meta').innerHTML = m;
  const pf = j.hwpx ? (j.task === 'polish' ? '이 윤문본을 한 번 더 다듬어요' : `방금 만든 ${j.preset || ''} HWPX를 서식 그대로 다듬어요`)
           : j.file ? `올린 문서(${j.file})를 ${/\.(hwpx|hwp)$/i.test(j.file) ? '원본 서식 그대로' : '프리셋으로 새 HWPX로'} 다듬어요` : '';
  $('polishBar').hidden = !pf; $('polishWhat').textContent = pf; $('polishGo').onclick = () => run({ task: 'polish', from_run: j.run_id, model: $('model').value, preset: j.preset || $('preset').value, strength: $('strength').value });
  $('src').textContent = j.source || '(문서 없음)';
  $('lint').textContent = j.lint ? JSON.stringify(j.lint, null, 2) : '(draft 작업에서만 실행)';
  $('log').textContent = j.log || '';
}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function diff(a, b, side) {  // 어절 단위 LCS — side 0: 원문(지운 곳), 1: 윤문(넣은 곳)
  const x = a.split(/(\s+)/), y = b.split(/(\s+)/), L = Array.from({ length: x.length + 1 }, () => new Array(y.length + 1).fill(0));
  for (let i = x.length - 1; i >= 0; i--) for (let k = y.length - 1; k >= 0; k--) L[i][k] = x[i] === y[k] ? L[i + 1][k + 1] + 1 : Math.max(L[i + 1][k], L[i][k + 1]);
  let i = 0, k = 0, o = '';
  while (i < x.length || k < y.length) {
    if (i < x.length && k < y.length && x[i] === y[k]) { o += esc(x[i]); i++; k++; }
    else if (k < y.length && (i >= x.length || L[i][k + 1] >= L[i + 1][k])) { if (side) o += `<ins>${esc(y[k])}</ins>`; k++; }
    else { if (!side) o += `<del>${esc(x[i])}</del>`; i++; }
  }
  return o;
}
async function loadRuns() {
  const rs = await fetch('/api/runs').then(r => r.json());
  $('runs').innerHTML = rs.map(r => `<li data-id="${r.run_id}">${r.ts} · ${r.task} · ${r.model} · ${r.file || '-'} · ${r.head}…</li>`).join('') || '<li>없음</li>';
  $('runs').querySelectorAll('li[data-id]').forEach(li => li.onclick = async () => {
    const j = await fetch('/api/runs/' + li.dataset.id).then(r => r.json()); $('q').value = j.question || ''; show(j);
  });
}
loadRuns();

const b64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = no; r.readAsDataURL(f); });

$('go').onclick = async () => {
  const f = $('file').files[0], question = $('q').value.trim();
  if (!f && !question) { $('status').textContent = '문서를 고르거나 요청을 쓰세요'; return; }
  const body = { task: $('task').value, question, model: $('model').value, preset: $('preset').value };
  if (f) { body.file_name = f.name; body.file_b64 = await b64(f); }
  run(body);
};

async function run(body) {
  $('go').disabled = $('polishGo').disabled = true; $('res').hidden = true; $('out').value = ''; $('stages').textContent = '';
  $('status').textContent = body.task === 'polish' ? '윤문 중 — 문서 길이에 따라 수십 초~수 분' : '실행 중 — 로컬 모델은 수 분 걸릴 수 있습니다';
  const t0 = Date.now();
  try {
    const r = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.stage) { $('stages').innerHTML += `<b>${ev.stage}</b> ${ev.msg} · `; if (ev.reset) $('out').value = ''; }
        if (ev.token) { $('out').value += ev.token; $('out').scrollTop = $('out').scrollHeight; }
        if (ev.error) throw new Error(ev.error);
        if (ev.done) { show(ev.done); loadRuns(); }
      }
    }
    $('status').textContent = `완료 ${((Date.now() - t0) / 1000).toFixed(0)}초`;
  } catch (e) { $('status').textContent = '오류: ' + e.message; }
  $('go').disabled = $('polishGo').disabled = false;
}
</script>
